<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LiDAR — OpenLiDARViewer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --marinho: #10192E;
            --marinho-hover: #1B2A4A;
            --royal: #3D4FE8;
            --salmao: #F0C089;
            --bege: #F5F1EB;
            --branco: #FFFFFF;
            --cinza-claro: #E8E4DE;

            --altura-topo: 52px;
            --altura-titulo: 44px;
            --altura-timeline: 104px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--marinho);
            font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
            color: var(--marinho);
            -webkit-font-smoothing: antialiased;
        }

        button {
            font-family: inherit;
        }

        /* =========================
           TELA DE CARREGAMENTO INICIAL
           ========================= */

        #loading {
            position: fixed;
            inset: 0;
            background: var(--branco);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.9s ease, visibility 0.7s ease;
        }

        #loading img.gif-carregando {
            width: min(70vw, 200px);
            height: auto;
        }

        #loading.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-rodape {
            position: absolute;
            bottom: 34px;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .loading-rodape span {
            font-size: 11px;
            font-style: italic;
            letter-spacing: 0.5px;
            color: var(--marinho);
            opacity: 0.55;
            margin-bottom: 10px;
        }

        .loading-rodape img {
            width: 130px;
            height: auto;
        }

        /* =========================
           CABEÇALHO
           ========================= */

        #topo {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--altura-topo);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--branco);
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s ease;
            z-index: 20;
        }

        #topo.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        body.immersive #topo {
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none;
        }

        #topo img {
            height: 26px;
            width: auto;
        }

        /* =========================
           BARRA DE TÍTULO
           ========================= */

        .titulo-bar {
            position: fixed;
            top: var(--altura-topo);
            left: 0;
            right: 0;
            height: var(--altura-titulo);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            background: var(--bege);
            border-bottom: 1px solid rgba(16, 25, 46, 0.08);
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity 0.5s ease 0.1s, transform 0.5s ease 0.1s;
            z-index: 19;
        }

        .titulo-bar.visible {
            opacity: 1;
            transform: translateY(0);
        }

        body.immersive .titulo-bar {
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none;
        }

        .titulo-bar .acento {
            width: 4px;
            height: 18px;
            background: var(--salmao);
            border-radius: 3px;
            flex-shrink: 0;
        }

        .titulo-bar h1 {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        .titulo-bar .subtitulo {
            font-size: 12px;
            opacity: 0.6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* =========================
           VIEWER — BACKGROUND CLARO
           ========================= */

        #viewer-shell {
            position: fixed;
            top: calc(var(--altura-topo) + var(--altura-titulo));
            left: 0;
            right: 0;
            bottom: var(--altura-timeline);
            background: var(--cinza-claro);
            transition: top 0.4s ease, bottom 0.4s ease;
        }

        body.immersive #viewer-shell {
            top: 0;
            bottom: var(--altura-timeline);
        }

        #viewer-shell iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* =========================
           TELA DE CARREGAMENTO DO IFRAME
           ========================= */

        #iframe-loader {
            position: absolute;
            inset: 0;
            background: var(--cinza-claro);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 10;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #iframe-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #iframe-loader .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(16, 25, 46, 0.15);
            border-top-color: var(--salmao);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #iframe-loader p {
            font-size: 13px;
            font-weight: 500;
            color: var(--marinho);
            opacity: 0.7;
        }

        /* =========================
           TIMELINE
           ========================= */

        #timeline {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: var(--altura-timeline);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 0 20px;
            background: var(--marinho);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 21;
        }

        body.immersive #timeline {
            background: rgba(16, 25, 46, 0.82);
            backdrop-filter: blur(6px);
        }

        .voo-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
            opacity: 0.55;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .voo-btn:hover {
            opacity: 0.85;
        }

        .voo-btn.ativo {
            opacity: 1;
        }

        .voo-btn:disabled {
            cursor: default;
            opacity: 0.35;
        }

        .voo-thumb {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            background: var(--marinho-hover);
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .voo-btn.ativo .voo-thumb {
            border-color: var(--salmao);
        }

        .voo-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .voo-thumb .icone-lidar {
            width: 26px;
            height: 26px;
            stroke: var(--branco);
            opacity: 0.7;
        }

        .voo-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--branco);
            letter-spacing: 0.3px;
        }

        .voo-tag {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--salmao);
            opacity: 0.9;
        }

        #btn-restaurar {
            position: fixed;
            top: 14px;
            right: 14px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(16, 25, 46, 0.75);
            color: var(--branco);
            font-size: 16px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 22;
        }

        body.immersive #btn-restaurar {
            display: flex;
        }

        /* =========================
           RESPONSIVIDADE
           ========================= */

        @media (max-width: 480px) {
            .voo-thumb {
                width: 48px;
                height: 48px;
            }
            #timeline {
                gap: 8px;
                padding: 0 8px;
            }
            .titulo-bar .subtitulo {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- TELA DE CARREGAMENTO INICIAL -->
    <div id="loading">
        <img class="gif-carregando" src="Imagens_Logos/Logo_animada2.gif" alt="Carregando">
        <div class="loading-rodape">
            <span>Desenvolvido por</span>
            <img src="Imagens_Logos/logo_MATRIOSKA.png" alt="MATRIOSKA Desenvolvimento e Soluções em Planejamento">
        </div>
    </div>

    <!-- CABEÇALHO -->
    <header id="topo">
        <img src="Imagens_Logos/logo_GB2.png" alt="GB">
        <img src="Imagens_Logos/logo_AFRY.png" alt="AFRY">
    </header>

    <!-- BARRA DE TÍTULO -->
    <div class="titulo-bar">
        <span class="acento"></span>
        <h1>NUVEM DE PONTOS LiDAR</h1>
        <span class="subtitulo">Rodovia Fernão Dias — levantamento aéreo semanal</span>
    </div>

    <!-- VIEWER -->
    <div id="viewer-shell">
        <!-- COMEÇA ESCONDIDO (class hidden) -->
        <div id="iframe-loader" class="hidden">
            <div class="spinner"></div>
            <p>Carregando nuvem de pontos...</p>
        </div>
        <iframe
            id="lidar-viewer"
            scrolling="no"
            title="OpenLiDARViewer"
            frameborder="0"
            allow="fullscreen"
            src=""
        ></iframe>
    </div>

    <button id="btn-restaurar" title="Sair da tela cheia">✕</button>

    <!-- TIMELINE -->
    <nav id="timeline"></nav>

    <script>
        const TEMPO_SPLASH = 2500;

        const CONFIG = {
            baseUrlArquivos: "https://pub-ff165ed52c304df59d57ae2f21220e3c.r2.dev",
            prefixoArquivo: "voo-",
            sufixoArquivo: ".copc.laz",
            // embed=1 REMOVIDO — mostra interface completa com ferramentas
            viewerBase: "https://olv-afrodite.matrioska-dev.workers.dev/?copc=",
            semanasExibidas: 4,
            diaDaSemanaAlvo: 3,
            offsetsBusca: [0, 1, -1, 2, -2, 3, -3],
        };

        function pad(n) {
            return String(n).padStart(2, "0");
        }

        function formatarDataArquivo(d) {
            return `${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${d.getFullYear()}`;
        }

        function formatarDataLabel(d) {
            return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`;
        }

        function nomeArquivoPara(d) {
            return `${CONFIG.prefixoArquivo}${formatarDataArquivo(d)}${CONFIG.sufixoArquivo}`;
        }

        function urlArquivoPara(d) {
            return `${CONFIG.baseUrlArquivos}/${nomeArquivoPara(d)}`;
        }

        function diaAlvoMaisRecente(referencia) {
            const d = new Date(referencia);
            d.setHours(0, 0, 0, 0);
            const diaAtual = d.getDay();
            const diferenca = (diaAtual - CONFIG.diaDaSemanaAlvo + 7) % 7;
            d.setDate(d.getDate() - diferenca);
            return d;
        }

        async function arquivoExiste(url) {
            try {
                const res = await fetch(url, { method: "HEAD", mode: "cors" });
                return res.ok;
            } catch (e) {
                return false;
            }
        }

        async function buscarVooDaSemana(diaAlvo) {
            for (const offset of CONFIG.offsetsBusca) {
                const candidata = new Date(diaAlvo);
                candidata.setDate(candidata.getDate() + offset);
                const url = urlArquivoPara(candidata);
                if (await arquivoExiste(url)) {
                    return { data: candidata, url };
                }
            }
            return null;
        }

        function iconeLidarSvg() {
            return `<svg class="icone-lidar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/>
                <path d="M16.24 16.24l2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/>
                <path d="M4.93 19.07l2.83-2.83"/><path d="M16.24 7.76l2.83-2.83"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>`;
        }

        function montarBotaoVoo(resultado, ehSemanaAtual) {
            const btn = document.createElement("button");
            btn.className = "voo-btn";
            btn.type = "button";

            const thumb = document.createElement("div");
            thumb.className = "voo-thumb";

            const label = document.createElement("span");
            label.className = "voo-label";

            if (resultado) {
                thumb.innerHTML = iconeLidarSvg();
                label.textContent = formatarDataLabel(resultado.data);
                btn.addEventListener("click", () => selecionarVoo(btn, resultado.url));
            } else {
                thumb.innerHTML = iconeLidarSvg();
                label.textContent = ehSemanaAtual ? "Buscando..." : "Sem voo";
                btn.disabled = true;
            }

            btn.appendChild(thumb);
            btn.appendChild(label);
            return btn;
        }

        function montarUrlViewer(urlArquivoLaz) {
            return CONFIG.viewerBase + encodeURIComponent(urlArquivoLaz);
        }

        function mostrarLoaderIframe() {
            document.getElementById("iframe-loader").classList.remove("hidden");
        }

        function esconderLoaderIframe() {
            document.getElementById("iframe-loader").classList.add("hidden");
        }

        function selecionarVoo(btnClicado, urlArquivoLaz) {
            document.querySelectorAll(".voo-btn").forEach((b) => b.classList.remove("ativo"));
            btnClicado.classList.add("ativo");

            mostrarLoaderIframe();
            const iframe = document.getElementById("lidar-viewer");
            iframe.src = montarUrlViewer(urlArquivoLaz);

            document.body.classList.add("immersive");
        }

        async function montarTimeline() {
            const nav = document.getElementById("timeline");
            const hoje = new Date();
            const diaAlvoAtual = diaAlvoMaisRecente(hoje);

            const ancoras = [];
            for (let i = 0; i < CONFIG.semanasExibidas; i++) {
                const ancora = new Date(diaAlvoAtual);
                ancora.setDate(ancora.getDate() - 7 * i);
                ancoras.push(ancora);
            }

            const resultados = await Promise.all(ancoras.map(buscarVooDaSemana));

            nav.innerHTML = "";

            // Cria botões: mais antigo (esquerda) -> mais recente (direita)
            for (let i = resultados.length - 1; i >= 0; i--) {
                const ehSemanaAtual = (i === 0);
                const btn = montarBotaoVoo(resultados[i], ehSemanaAtual);
                nav.appendChild(btn);
            }

            // Carrega automaticamente o voo mais recente disponível
            const maisRecenteIdx = resultados.findIndex((r) => r !== null);
            if (maisRecenteIdx !== -1) {
                const maisRecente = resultados[maisRecenteIdx];
                const iframe = document.getElementById("lidar-viewer");
                iframe.src = montarUrlViewer(maisRecente.url);

                // Marca o botão correto como ativo
                const domIdx = (resultados.length - 1) - maisRecenteIdx;
                const botoes = nav.querySelectorAll(".voo-btn");
                if (botoes[domIdx]) {
                    botoes[domIdx].classList.add("ativo");
                }
            }
        }

        document.getElementById("btn-restaurar").addEventListener("click", () => {
            document.body.classList.remove("immersive");
        });

        // Esconde o loader do iframe quando ele terminar de carregar
        document.getElementById("lidar-viewer").addEventListener("load", () => {
            esconderLoaderIframe();
        });

        window.addEventListener("load", function () {
            montarTimeline();

            setTimeout(function () {
                const loading = document.getElementById("loading");
                const topo = document.getElementById("topo");
                const tituloBar = document.querySelector(".titulo-bar");

                loading.classList.add("hidden");
                topo.classList.add("visible");
                tituloBar.classList.add("visible");
            }, TEMPO_SPLASH);
        });
    </script>
</body>
</html>

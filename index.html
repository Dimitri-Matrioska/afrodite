    <style>
        :root {
            --marinho: #001e38;
            --marinho-hover: #102a45;
            --royal: #3D4FE8;
            --salmao: #F0C089;
            --bege: #F5F1EB;
            --branco: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            /* Fundo com o GIF animado em loop */
            background-image: url('Imagens_Logos/fundo.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
            color: var(--branco);
            position: relative;
        }

        /* Máscara de Gradiente:
           0% a 15% (Cabeçalho): Cor sólida (#001e38 - opacidade 1.0)
           100% (Rodapé): 60% de transparência (opacidade 0.40) */
        .overlay-gradiente {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0, 30, 56, 1) 0%,
                rgba(0, 30, 56, 1) 30%,
                rgba(0, 30, 56, 0.40) 100%
            );
            z-index: 1;
            pointer-events: none;
        }

        /* Conteúdo sobreposto ao gradiente */
        .container-pagina {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 60px;
        }

        /* =========================
           TELA DE CARREGAMENTO (SPLASH)
           ========================= */

        #loading {
            position: fixed;
            inset: 0;
            background: var(--branco);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #loading img.gif-carregando {
            width: min(70vw, 200px);
            height: auto;
        }

        #loading.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-rodape {
            position: absolute;
            bottom: 34px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .loading-rodape span {
            font-size: 11px;
            font-style: italic;
            letter-spacing: 0.5px;
            color: #10192E;
            opacity: 0.55;
            margin-bottom: 10px;
        }

        .loading-rodape img {
            width: 130px;
            height: auto;
        }

        /* =========================
           ESTRUTURA DA PÁGINA
           ========================= */

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .header-titles .projeto {
            color: #3b82f6;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .header-titles .relatorio {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1.5px;
            color: #e2e8f0;
        }

        .header-logos {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .header-logos img {
            height: 26px;
            width: auto;
        }

        /* Botões centrais */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }

        .btn-portal {
            width: 100%;
            padding: 20px 24px;
            background: rgba(0, 30, 56, 0.65);
            border: 1px solid rgba(240, 192, 137, 0.4);
            border-radius: 12px;
            color: var(--bege);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
        }

        .btn-portal:hover {
            background: var(--marinho-hover);
            border-color: var(--salmao);
            color: var(--salmao);
            transform: translateY(-2px);
        }

        .btn-portal svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.8;
        }

        footer {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            width: 100%;
        }

        .brand-desenvolvido {
            font-size: 12px;
            opacity: 0.85;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }

        @media (max-width: 480px) {
            .container-pagina { padding: 25px 20px; }
            .header-logos img { height: 22px; }
        }
    </style>
</head>

        function pad(n) {
            return String(n).padStart(2, "0");
        }

        function formatarDataArquivo(d) {
            return `${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${d.getFullYear()}`;
        }

        function formatarDataLabel(d) {
            return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`;
        }

        function nomeArquivoPara(d) {
            return `${CONFIG.prefixoArquivo}${formatarDataArquivo(d)}${CONFIG.sufixoArquivo}`;
        }

        function urlArquivoPara(d) {
            return `${CONFIG.baseUrlArquivos}/${nomeArquivoPara(d)}`;
        }

        async function arquivoExiste(url) {
            try {
                const res = await fetch(url, { method: "HEAD", mode: "cors" });
                return res.ok;
            } catch (e) {
                return false;
            }
        }

        async function listarVoosDisponiveis({ maxDias = CONFIG.diasBusca, maxResultados = CONFIG.maxVoosTimeline } = {}) {
            const hoje = new Date();
            const resultados = [];

            for (let diasAtras = 0; diasAtras < maxDias && resultados.length < maxResultados; diasAtras++) {
                const data = new Date(hoje);
                data.setHours(0, 0, 0, 0);
                data.setDate(data.getDate() - diasAtras);

                const url = urlArquivoPara(data);
                if (await arquivoExiste(url)) {
                    resultados.push({ data, url });
                }
            }

            return resultados.sort((a, b) => b.data.getTime() - a.data.getTime());
        }

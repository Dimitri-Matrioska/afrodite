<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matrioska - Projeto Afrodite</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --marinho: #10192E;
            --marinho-hover: #1B2A4A;
            --royal: #3D4FE8;
            --salmao: #F0C089;
            --bege: #F5F1EB;
            --branco: #FFFFFF;
            --cinza-claro: #E8E4DE;

            --altura-topo: 55px;
            --altura-titulo: 45px;
            --altura-timeline: 100px;
            --altura-perfil: 270px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--marinho);
            font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
            color: var(--marinho);
            -webkit-font-smoothing: antialiased;
        }

        button {
            font-family: inherit;
        }

        /* =========================
           TELA DE CARREGAMENTO INICIAL
           ========================= */

        #loading {
            position: fixed;
            inset: 0;
            background: var(--branco);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.9s ease, visibility 0.7s ease;
        }

        #loading img.gif-carregando {
            width: min(70vw, 200px);
            height: auto;
        }

        #loading.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-rodape {
            position: absolute;
            bottom: 34px;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .loading-rodape span {
            font-size: 11px;
            font-style: italic;
            letter-spacing: 0.5px;
            color: var(--marinho);
            opacity: 0.55;
            margin-bottom: 10px;
        }

        .loading-rodape img {
            width: 130px;
            height: auto;
        }

        /* =========================
           CABEÇALHO
           ========================= */

        #topo {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--altura-topo);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--branco);
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s ease;
            z-index: 20;
        }

        #topo.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        #topo img {
            height: 26px;
            width: auto;
        }

        /* =========================
           BARRA DE TÍTULO
           ========================= */

        .titulo-bar {
            position: fixed;
            top: var(--altura-topo);
            left: 0;
            right: 0;
            height: var(--altura-titulo);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            background: var(--bege);
            border-bottom: 1px solid rgba(16, 25, 46, 0.08);
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity 0.5s ease 0.1s, transform 0.5s ease 0.1s;
            z-index: 19;
        }

        .titulo-bar.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .titulo-bar .acento {
            width: 4px;
            height: 18px;
            background: var(--salmao);
            border-radius: 3px;
            flex-shrink: 0;
        }

        .titulo-bar h1 {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        .titulo-bar .subtitulo {
            font-size: 12px;
            opacity: 0.6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* =========================
           VIEWER — BACKGROUND CLARO
           ========================= */

        #viewer-shell {
            position: fixed;
            top: calc(var(--altura-topo) + var(--altura-titulo));
            left: 0;
            right: 0;
            bottom: var(--altura-timeline);
            background: var(--marinho);
        }

        body.profile-open #viewer-shell {
            bottom: calc(var(--altura-timeline) + var(--altura-perfil));
        }

        #viewer-shell iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        #basic-toolbar {
            position: fixed;
            top: calc(var(--altura-topo) + var(--altura-titulo) + 18px);
            right: 16px;
            bottom: calc(var(--altura-timeline) + 18px);
            z-index: 12;
            display: flex;
            align-items: center;
        }

        body.profile-open #basic-toolbar {
            bottom: calc(var(--altura-timeline) + var(--altura-perfil) + 12px);
        }

        .toolbar-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px;
            border: 1px solid rgba(240, 192, 137, 0.32);
            border-radius: 14px;
            background: rgba(16, 25, 46, 0.94);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
        }

        .toolbar-modes {
            display: flex;
            gap: 2px;
            padding: 3px;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.08);
        }

        .toolbar-mode {
            min-width: 58px;
            padding: 6px 7px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: rgba(255, 255, 255, 0.72);
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
        }

        .toolbar-mode[aria-pressed="true"] {
            background: var(--salmao);
            color: var(--marinho);
        }

        #basic-tools {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .tool-button {
            display: flex;
            width: 176px;
            height: 42px;
            align-items: center;
            gap: 11px;
            padding: 0 10px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: transparent;
            color: var(--bege);
            cursor: pointer;
            text-align: left;
            transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
        }

        .tool-button:hover,
        .tool-button:focus-visible {
            border-color: rgba(240, 192, 137, 0.6);
            background: var(--marinho-hover);
            color: var(--salmao);
            outline: none;
        }

        .tool-button[aria-pressed="true"] {
            background: var(--salmao);
            color: var(--marinho);
        }

        .elevation-palette-control {
            position: relative;
        }

        .elevation-palette-menu {
            position: absolute;
            bottom: 0;
            right: calc(100% + 8px);
            z-index: 15;
            display: grid;
            width: 184px;
            gap: 3px;
            padding: 7px;
            border: 1px solid rgba(240, 192, 137, 0.32);
            border-radius: 12px;
            background: rgba(16, 25, 46, 0.97);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
        }

        .elevation-palette-menu[hidden] {
            display: none;
        }

        .palette-option {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 30px;
            padding: 4px 7px;
            border: 1px solid transparent;
            border-radius: 7px;
            background: transparent;
            color: var(--bege);
            cursor: pointer;
            font: inherit;
            font-size: 11px;
            text-align: left;
        }

        .palette-option:hover,
        .palette-option:focus-visible,
        .palette-option[aria-pressed="true"] {
            border-color: rgba(240, 192, 137, 0.55);
            background: var(--marinho-hover);
            color: var(--salmao);
            outline: none;
        }

        .palette-swatch {
            width: 44px;
            height: 10px;
            flex: 0 0 44px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 5px;
        }

        .tool-button svg {
            flex: 0 0 21px;
            width: 21px;
            height: 21px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.7;
        }

        .tool-label {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        body.mode-advanced #basic-tools {
            display: none;
        }

        /* =========================
           TELA DE CARREGAMENTO DO IFRAME
           ========================= */

        #iframe-loader {
            position: absolute;
            inset: 0;
            background: var(--marinho);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 10;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #iframe-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #iframe-loader .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(16, 25, 46, 0.15);
            border-top-color: var(--salmao);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #iframe-loader p {
            font-size: 13px;
            font-weight: 500;
            color: var(--branco);
            opacity: 0.7;
        }

        /* =========================
           TIMELINE
           ========================= */

        #timeline {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: var(--altura-timeline);
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px 20px 8px;
            background: var(--marinho);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 21;
        }

        .timeline-heading {
            display: flex;
            align-items: baseline;
            gap: 10px;
            min-height: 16px;
            color: var(--branco);
        }

        .timeline-heading strong {
            font-size: 10px;
            letter-spacing: 1px;
        }

        #timeline-status {
            min-width: 0;
            overflow: hidden;
            color: rgba(255, 255, 255, 0.62);
            font-size: 11px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #timeline-list {
            position: relative;
            display: flex;
            flex: 1;
            align-items: flex-start;
            gap: 18px;
            min-height: 0;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0 8px 6px;
            scrollbar-color: var(--marinho-hover) transparent;
            scrollbar-width: thin;
        }

        #timeline-list::before {
            position: absolute;
            top: 25px;
            right: 8px;
            left: 8px;
            height: 1px;
            background: rgba(255, 255, 255, 0.22);
            content: "";
        }

        .voo-btn {
            display: flex;
            flex: 0 0 180px;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--branco);
            opacity: 0.72;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .voo-btn:hover {
            opacity: 0.85;
        }

        .voo-btn.ativo {
            opacity: 1;
        }

        .voo-btn.ativo .timeline-marker {
            background: var(--salmao);
            box-shadow: 0 0 0 2px rgba(240, 192, 137, 0.3);
        }

        .voo-btn:disabled {
            cursor: default;
            opacity: 0.35;
        }

        .timeline-date {
            color: var(--salmao);
            font-size: 10px;
            font-weight: 600;
            line-height: 14px;
        }

        .timeline-marker {
            position: relative;
            z-index: 1;
            width: 13.5px;
            height: 13.5px;
            margin: 0 0 1px 2px;
            border: 2px solid var(--marinho);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.65);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.45);
        }

        /* =========================
           PERFIL DE ELEVAÇÃO
           ========================= */

        #profile-panel {
            position: fixed;
            right: 0;
            bottom: var(--altura-timeline);
            left: 0;
            z-index: 13;
            display: grid;
            height: var(--altura-perfil);
            grid-template-rows: auto auto minmax(0, 1fr) auto;
            gap: 8px;
            padding: 12px 20px 9px;
            border-top: 1px solid rgba(61, 79, 232, 0.55);
            background:
                radial-gradient(ellipse at 50% 0, rgba(61, 79, 232, 0.15), transparent 60%),
                #0c1427;
            color: var(--bege);
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.22);
        }

        #profile-panel[hidden] {
            display: none;
        }

        .profile-heading,
        .profile-chart-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-width: 0;
        }

        .profile-title {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
        }

        .profile-title-mark {
            width: 8px;
            height: 8px;
            flex: 0 0 8px;
            border-radius: 50%;
            background: #56e3f0;
            box-shadow: 0 0 12px rgba(86, 227, 240, 0.8);
        }

        .profile-title strong {
            font-size: 11px;
            letter-spacing: 1.1px;
        }

        #profile-instructions {
            overflow: hidden;
            color: rgba(245, 241, 235, 0.62);
            font-size: 11px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #profile-close {
            width: 28px;
            height: 28px;
            flex: 0 0 28px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--bege);
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
        }

        #profile-close:hover {
            border-color: rgba(240, 192, 137, 0.6);
            color: var(--salmao);
        }

        #profile-metrics {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 7px;
        }

        .profile-metric {
            min-width: 0;
            padding: 5px 9px 6px;
            border: 1px solid rgba(123, 148, 205, 0.14);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.035);
        }

        .profile-metric span {
            display: block;
            overflow: hidden;
            color: rgba(245, 241, 235, 0.52);
            font-size: 9px;
            letter-spacing: 0.45px;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .profile-metric strong {
            display: block;
            overflow: hidden;
            margin-top: 1px;
            color: #f5f1eb;
            font-size: 14px;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .profile-chart {
            display: grid;
            min-height: 0;
            grid-template-rows: auto minmax(0, 1fr);
            gap: 2px;
        }

        .profile-chart-heading {
            color: rgba(245, 241, 235, 0.58);
            font-size: 9px;
            letter-spacing: 0.8px;
        }

        #profile-range {
            color: rgba(86, 227, 240, 0.85);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0;
            text-align: right;
        }

        #profile-chart {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 80px;
        }

        #profile-status {
            overflow: hidden;
            color: rgba(245, 241, 235, 0.58);
            font-size: 10px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* =========================
           RESPONSIVIDADE
           ========================= */

        @media (max-width: 480px) {
            :root {
                --altura-topo: 46px;
                --altura-titulo: 40px;
                --altura-timeline: 124px;
                --altura-perfil: 310px;
            }

            #topo { padding: 0 12px; }
            #topo img { height: 23px; }
            .titulo-bar { gap: 8px; padding: 0 12px; }
            .titulo-bar h1 { font-size: 12px; }
            .titulo-bar .subtitulo { display: none; }
            #basic-toolbar { right: 8px; }
            .toolbar-panel { gap: 4px; padding: 6px; }
            .toolbar-mode { min-width: 52px; padding: 6px 5px; }
            .tool-button { width: 156px; height: 38px; gap: 9px; }
            .tool-label { font-size: 11px; }
            #timeline {
                padding: 8px 10px 6px;
            }
            #timeline-list { gap: 12px; }
            .voo-btn { flex-basis: 150px; }
            #profile-panel { gap: 7px; padding: 9px 10px 7px; }
            #profile-metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
            .profile-metric { padding: 4px 6px; }
            .profile-metric strong { font-size: 12px; }
            #profile-instructions { font-size: 10px; }
            .profile-chart-heading { font-size: 8px; }
        }

        @media (min-width: 481px) and (max-width: 760px) {
            #profile-metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
    </style>
</head>

<body>

    <!-- TELA DE CARREGAMENTO INICIAL -->
    <div id="loading">
        <img class="gif-carregando" src="Imagens_Logos/Logo_animada2.gif" alt="Carregando">
        <div class="loading-rodape">
            <span>Desenvolvido por</span>
            <img src="Imagens_Logos/logo_MATRIOSKA.png" alt="MATRIOSKA Desenvolvimento e Soluções em Planejamento">
        </div>
    </div>

    <!-- CABEÇALHO -->
    <header id="topo">
        <img src="Imagens_Logos/logo_GB2.png" alt="GB">
        <img src="Imagens_Logos/logo_AFRY.png" alt="AFRY">
    </header>

    <!-- BARRA DE TÍTULO -->
    <div class="titulo-bar">
        <span class="acento"></span>
        <h1>PROJETO AFRODITE</h1>
        <span class="subtitulo">levantamento aéreo</span>
    </div>

    <!-- VIEWER -->
    <div id="viewer-shell">
        <div id="iframe-loader">
            <div class="spinner"></div>
            <p>Buscando arquivos...</p>
        </div>
        <iframe
            id="lidar-viewer"
            scrolling="no"
            title="OpenLiDARViewer"
            frameborder="0"
            allow="fullscreen"
            src=""
        ></iframe>

        <aside id="basic-toolbar" aria-label="Ferramentas do visualizador">
            <div class="toolbar-panel">
                <div class="toolbar-modes" role="group" aria-label="Modo do visualizador">
                    <button class="toolbar-mode" type="button" data-viewer-mode="basic" aria-pressed="true">Básico</button>
                    <button class="toolbar-mode" type="button" data-viewer-mode="advanced" aria-pressed="false">Avançado</button>
                </div>
                <div id="basic-tools" role="toolbar" aria-label="Ferramentas básicas">
                    <button class="tool-button" type="button" data-potree-action="fit" title="Enquadrar nuvem" aria-label="Enquadrar nuvem">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M9 9h6v6H9z"/></svg>
                        <span class="tool-label">Enquadrar</span>
                    </button>
                    <button class="tool-button" type="button" data-potree-action="distance" title="Medir distância" aria-label="Medir distância">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18 18 4M7 4H4v3M20 17v3h-3"/><path d="m8 14 2 2M12 10l2 2M15 7l2 2"/></svg>
                        <span class="tool-label">Distância</span>
                    </button>
                    <button class="tool-button" type="button" data-potree-action="area" title="Medir área" aria-label="Medir área">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 18 2-11 9-3 5 8-6 8z"/><path d="m6 7 8 13M15 4l-1 16"/></svg>
                        <span class="tool-label">Área</span>
                    </button>
                    <button class="tool-button" type="button" data-potree-action="profile" title="Desenhar uma linha e ver o perfil de elevação" aria-label="Perfil de elevação" aria-pressed="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19h18M4 16l5-5 4 2 6-8"/><circle cx="4" cy="16" r="1"/><circle cx="19" cy="5" r="1"/></svg>
                        <span class="tool-label">Perfil de elevação</span>
                    </button>
                    <button class="tool-button" type="button" data-potree-action="sample-elevation" title="Calcular elevação média em uma grade 3 × 3" aria-label="Calcular elevação média em uma grade 3 por 3" aria-pressed="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v14H5z"/><path d="M9.7 5v14M14.3 5v14M5 9.7h14M5 14.3h14"/><path d="M8 2v2M16 2v2"/></svg>
                        <span class="tool-label">Elevação média</span>
                    </button>
                    <button class="tool-button" type="button" data-potree-action="clear-measurements" title="Apagar todas as medições e cotas" aria-label="Apagar todas as medições e cotas">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 15 8-8a2 2 0 0 1 3 0l7 7-7 7H8z"/><path d="m7 11 7 7M4 21h16"/></svg>
                        <span class="tool-label">Apagar medições</span>
                    </button>
                    <div class="elevation-palette-control" id="elevation-palette-control">
                        <button class="tool-button" id="elevation-palette-toggle" type="button" title="Escolher paleta de cores por elevação" aria-label="Escolher paleta de cores por elevação" aria-expanded="false" aria-controls="elevation-palette-menu" aria-pressed="false">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 18 6-7 4 4 3-5 5 8z"/><path d="M4 21h16"/></svg>
                            <span class="tool-label">Cor por elevação</span>
                        </button>
                        <div class="elevation-palette-menu" id="elevation-palette-menu" role="group" aria-label="Paletas de cores por elevação" hidden></div>
                    </div>
                    <button class="tool-button" type="button" data-potree-action="rgb" title="Mostrar cores originais" aria-label="Mostrar cores originais" aria-pressed="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h1.2a2 2 0 0 0 1.5-3.3 1.7 1.7 0 0 1 1.3-2.8H18a3 3 0 0 0 3-3c0-5-4-8.9-9-8.9Z"/><path d="M7.5 10h.01M11.5 7h.01M16 9h.01"/></svg>
                        <span class="tool-label">Cores originais</span>
                    </button>
                </div>
            </div>
        </aside>
    </div>

    <section id="profile-panel" aria-label="Perfil de elevação" aria-live="polite" hidden>
        <div class="profile-heading">
            <div class="profile-title">
                <span class="profile-title-mark" aria-hidden="true"></span>
                <strong>PERFIL DE ELEVAÇÃO</strong>
                <span id="profile-instructions">Desenhe uma linha sobre a nuvem e clique com o botão direito para concluir.</span>
            </div>
            <button id="profile-close" type="button" aria-label="Fechar perfil de elevação" title="Fechar perfil">×</button>
        </div>
        <div id="profile-metrics">
            <div class="profile-metric"><span>Distância</span><strong data-profile-metric="distance">—</strong></div>
            <div class="profile-metric"><span>Δ cota</span><strong data-profile-metric="delta">—</strong></div>
            <div class="profile-metric"><span>Inclinação</span><strong data-profile-metric="slope">—</strong></div>
            <div class="profile-metric"><span>Ângulo</span><strong data-profile-metric="angle">—</strong></div>
            <div class="profile-metric"><span>Cota inicial</span><strong data-profile-metric="start">—</strong></div>
            <div class="profile-metric"><span>Cota final</span><strong data-profile-metric="end">—</strong></div>
        </div>
        <div class="profile-chart">
            <div class="profile-chart-heading">
                <span>COTA AO LONGO DO TRAJETO</span>
                <span id="profile-range"></span>
            </div>
            <canvas id="profile-chart" aria-label="Gráfico da elevação em função da distância"></canvas>
        </div>
        <div id="profile-status" role="status">Aguardando o desenho do perfil.</div>
    </section>

    <footer id="timeline">
        <div class="timeline-heading">
            <strong>VOOS</strong>
            <span id="timeline-status" role="status" aria-live="polite"></span>
        </div>
        <nav id="timeline-list" aria-label="Arquivos em ordem cronológica"></nav>
    </footer>

    <script>
        const TEMPO_SPLASH = 2500;
        const CONFIG = {
            listUrl: "https://listar-nuvens-potree.matrioska-dev.workers.dev/api/nuvens",
            publicBaseUrl: "https://pub-ff165ed52c304df59d57ae2f21220e3c.r2.dev",
            viewerBase: "app/index.html",
        };

        const iframe = document.getElementById("lidar-viewer");
        const loader = document.getElementById("iframe-loader");
        const timeline = document.getElementById("timeline-list");
        const statusTimeline = document.getElementById("timeline-status");
        const profilePanel = document.getElementById("profile-panel");
        const profileCanvas = document.getElementById("profile-chart");
        const profileContext = profileCanvas.getContext("2d");
        const profileStatus = document.getElementById("profile-status");
        const profileInstructions = document.getElementById("profile-instructions");
        const profileRange = document.getElementById("profile-range");
        let viewerMode = "basic";
        let selectedElevationPalette = null;
        let profileChartData = null;
        const paletteLabels = {
            SPECTRAL: "Spectral",
            PLASMA: "Plasma",
            YELLOW_GREEN: "Yellow-Green",
            VIRIDIS: "Viridis",
            INFERNO: "Inferno",
            GRAYSCALE: "Grayscale",
            TURBO: "Turbo",
            RAINBOW: "Rainbow",
            CONTOUR: "Contour",
        };
        const paletteSwatches = {
            SPECTRAL: "linear-gradient(90deg, #5e4fa2, #3288bd, #66c2a5, #abdda4, #e6f598, #ffffbf, #fee08b, #fdae61, #f46d43, #d53e4f, #9e0142)",
            PLASMA: "linear-gradient(90deg, #3e039c, #8306a8, #c74687, #e96b53, #fdb32f, #effa21)",
            YELLOW_GREEN: "linear-gradient(90deg, #2a4858, #008287, #00a892, #4abd86, #9cdd7c, #fafb6e)",
            VIRIDIS: "linear-gradient(90deg, #440154, #414487, #2a788e, #22a884, #7ad151, #fde725)",
            INFERNO: "linear-gradient(90deg, #140b35, #57106e, #a52c60, #e55b31, #fca50a, #fcffa4)",
            GRAYSCALE: "linear-gradient(90deg, #000, #fff)",
            TURBO: "linear-gradient(90deg, #30123b, #466be3, #28bbec, #32f298, #c8e020, #f98e09, #b40426)",
            RAINBOW: "linear-gradient(90deg, #4700b6, #0000ff, #00ffff, #00ff00, #ffff00, #ffa300, #ff0000)",
            CONTOUR: "linear-gradient(90deg, #000 0 48%, #fff 48% 100%)",
        };

        function sendViewerCommand(type, details = {}) {
            iframe.contentWindow?.postMessage(
                { channel: "afrodite-potree", type, ...details },
                window.location.origin
            );
        }

        function setProfilePanelOpen(open) {
            profilePanel.hidden = !open;
            document.body.classList.toggle("profile-open", open);
            document.querySelector('[data-potree-action="profile"]')
                .setAttribute("aria-pressed", String(open));
            if (open) requestAnimationFrame(drawProfileChart);
        }

        function formatProfileValue(value, digits = 2) {
            return new Intl.NumberFormat("pt-BR", {
                minimumFractionDigits: digits,
                maximumFractionDigits: digits
            }).format(value);
        }

        function updateProfileMetrics(metrics) {
            if (!metrics) return;
            const signed = value => `${value > 0 ? "+" : ""}${formatProfileValue(value)}`;
            const values = {
                distance: `${formatProfileValue(metrics.distance)} m`,
                delta: `${signed(metrics.deltaZ)} m`,
                slope: metrics.slopePercent === null ? "—" : `${signed(metrics.slopePercent)}%`,
                angle: metrics.angleDegrees === null ? "—" : `${signed(metrics.angleDegrees)}°`,
                start: `${formatProfileValue(metrics.startElevation)} m`,
                end: `${formatProfileValue(metrics.endElevation)} m`
            };
            Object.entries(values).forEach(([key, value]) => {
                profilePanel.querySelector(`[data-profile-metric="${key}"]`).textContent = value;
            });
        }

        function drawProfileChart() {
            if (profilePanel.hidden) return;
            const bounds = profileCanvas.getBoundingClientRect();
            if (!bounds.width || !bounds.height) return;
            const pixelRatio = window.devicePixelRatio || 1;
            profileCanvas.width = Math.round(bounds.width * pixelRatio);
            profileCanvas.height = Math.round(bounds.height * pixelRatio);
            profileContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
            profileContext.clearRect(0, 0, bounds.width, bounds.height);

            const samples = profileChartData?.samples || [];
            if (samples.length < 2) {
                profileContext.fillStyle = "rgba(245, 241, 235, 0.48)";
                profileContext.font = "11px IBM Plex Sans, sans-serif";
                profileContext.textAlign = "center";
                profileContext.fillText("O gráfico será exibido após o processamento dos pontos.", bounds.width / 2, bounds.height / 2);
                return;
            }

            const left = 42;
            const right = 10;
            const top = 7;
            const bottom = 22;
            const plotWidth = Math.max(1, bounds.width - left - right);
            const plotHeight = Math.max(1, bounds.height - top - bottom);
            const minDistance = samples[0].distance;
            const maxDistance = samples[samples.length - 1].distance;
            const minElevation = Math.min(...samples.map(sample => sample.elevation));
            const maxElevation = Math.max(...samples.map(sample => sample.elevation));
            const elevationSpan = Math.max(maxElevation - minElevation, 0.01);
            const minAxis = minElevation - elevationSpan * 0.12;
            const maxAxis = maxElevation + elevationSpan * 0.12;
            const xAt = distance => left + ((distance - minDistance) / Math.max(maxDistance - minDistance, 0.001)) * plotWidth;
            const yAt = elevation => top + ((maxAxis - elevation) / (maxAxis - minAxis)) * plotHeight;

            profileContext.font = "9px IBM Plex Sans, sans-serif";
            profileContext.lineWidth = 1;
            profileContext.textAlign = "right";
            for (let i = 0; i <= 3; i++) {
                const y = top + plotHeight * i / 3;
                const value = maxAxis - (maxAxis - minAxis) * i / 3;
                profileContext.strokeStyle = "rgba(158, 179, 221, 0.12)";
                profileContext.beginPath();
                profileContext.moveTo(left, y);
                profileContext.lineTo(left + plotWidth, y);
                profileContext.stroke();
                profileContext.fillStyle = "rgba(245, 241, 235, 0.52)";
                profileContext.fillText(formatProfileValue(value, 1), left - 7, y + 3);
            }

            profileContext.textAlign = "center";
            for (let i = 0; i <= 4; i++) {
                const x = left + plotWidth * i / 4;
                const distance = minDistance + (maxDistance - minDistance) * i / 4;
                profileContext.strokeStyle = "rgba(158, 179, 221, 0.08)";
                profileContext.beginPath();
                profileContext.moveTo(x, top);
                profileContext.lineTo(x, top + plotHeight);
                profileContext.stroke();
                profileContext.fillStyle = "rgba(245, 241, 235, 0.52)";
                profileContext.fillText(`${formatProfileValue(distance, 0)} m`, x, bounds.height - 5);
            }

            profileContext.beginPath();
            samples.forEach((sample, index) => {
                const x = xAt(sample.distance);
                const y = yAt(sample.elevation);
                if (index === 0) profileContext.moveTo(x, y);
                else profileContext.lineTo(x, y);
            });
            profileContext.lineTo(xAt(samples[samples.length - 1].distance), top + plotHeight);
            profileContext.lineTo(xAt(samples[0].distance), top + plotHeight);
            profileContext.closePath();
            const fill = profileContext.createLinearGradient(0, top, 0, top + plotHeight);
            fill.addColorStop(0, "rgba(86, 227, 240, 0.22)");
            fill.addColorStop(1, "rgba(61, 79, 232, 0.015)");
            profileContext.fillStyle = fill;
            profileContext.fill();

            profileContext.beginPath();
            samples.forEach((sample, index) => {
                const x = xAt(sample.distance);
                const y = yAt(sample.elevation);
                if (index === 0) profileContext.moveTo(x, y);
                else profileContext.lineTo(x, y);
            });
            profileContext.strokeStyle = "#56e3f0";
            profileContext.lineWidth = 2;
            profileContext.shadowColor = "rgba(86, 227, 240, 0.55)";
            profileContext.shadowBlur = 7;
            profileContext.stroke();
            profileContext.shadowBlur = 0;
            profileContext.fillStyle = "#f0c089";
            for (const index of [0, samples.length - 1]) {
                const sample = samples[index];
                profileContext.beginPath();
                profileContext.arc(xAt(sample.distance), yAt(sample.elevation), 3, 0, Math.PI * 2);
                profileContext.fill();
            }
            profileRange.textContent = `Mín. ${formatProfileValue(minElevation)} m  ·  Máx. ${formatProfileValue(maxElevation)} m`;
        }

        function closeProfilePanel() {
            setProfilePanelOpen(false);
            profileChartData = null;
        }

        document.getElementById("profile-close").addEventListener("click", () => {
            closeProfilePanel();
            sendViewerCommand("tool", { action: "profile-close" });
        });

        window.addEventListener("resize", drawProfileChart);

        function setViewerMode(mode) {
            viewerMode = mode;
            document.body.classList.toggle("mode-advanced", mode === "advanced");
            document.querySelectorAll("[data-viewer-mode]").forEach(button => {
                button.setAttribute("aria-pressed", String(button.dataset.viewerMode === mode));
            });
            sendViewerCommand("mode", { mode });
        }

        document.querySelectorAll("[data-viewer-mode]").forEach(button => {
            button.addEventListener("click", () => setViewerMode(button.dataset.viewerMode));
        });

        const elevationPaletteControl = document.getElementById("elevation-palette-control");
        const elevationPaletteToggle = document.getElementById("elevation-palette-toggle");
        const elevationPaletteMenu = document.getElementById("elevation-palette-menu");

        function setElevationPaletteMenuOpen(open) {
            elevationPaletteMenu.hidden = !open;
            elevationPaletteToggle.setAttribute("aria-expanded", String(open));
        }

        Object.entries(paletteLabels).forEach(([palette, label]) => {
            const option = document.createElement("button");
            option.className = "palette-option";
            option.type = "button";
            option.dataset.elevationPalette = palette;
            option.setAttribute("aria-pressed", "false");

            const swatch = document.createElement("span");
            swatch.className = "palette-swatch";
            swatch.style.background = paletteSwatches[palette];
            swatch.setAttribute("aria-hidden", "true");

            const name = document.createElement("span");
            name.textContent = label;
            option.append(swatch, name);
            option.addEventListener("click", () => {
                selectedElevationPalette = palette;
                sendViewerCommand("tool", { action: "elevation", palette });
                elevationPaletteToggle.setAttribute("aria-pressed", "true");
                document.querySelector('[data-potree-action="rgb"]').setAttribute("aria-pressed", "false");
                elevationPaletteMenu.querySelectorAll(".palette-option").forEach(button => {
                    button.setAttribute("aria-pressed", String(button.dataset.elevationPalette === palette));
                });
                setElevationPaletteMenuOpen(false);
            });
            elevationPaletteMenu.append(option);
        });

        elevationPaletteToggle.addEventListener("click", () => {
            setElevationPaletteMenuOpen(elevationPaletteMenu.hidden);
        });

        document.addEventListener("click", event => {
            if (!elevationPaletteControl.contains(event.target)) setElevationPaletteMenuOpen(false);
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape" && !elevationPaletteMenu.hidden) {
                setElevationPaletteMenuOpen(false);
                elevationPaletteToggle.focus();
            }
        });

        document.querySelectorAll("[data-potree-action]").forEach(button => {
            button.addEventListener("click", () => {
                const action = button.dataset.potreeAction;
                if (action === "profile") {
                    profileChartData = null;
                    profileInstructions.textContent = "Desenhe uma linha sobre a nuvem e clique com o botão direito para concluir.";
                    profileStatus.textContent = "Clique sobre a nuvem para marcar o início e o fim do perfil.";
                    profileRange.textContent = "";
                    profilePanel.querySelectorAll("[data-profile-metric]").forEach(metric => {
                        metric.textContent = "—";
                    });
                    setProfilePanelOpen(true);
                } else if (action === "clear-measurements") {
                    closeProfilePanel();
                }
                sendViewerCommand("tool", { action });

                if (action === "rgb") {
                    selectedElevationPalette = null;
                    elevationPaletteToggle.setAttribute("aria-pressed", "false");
                }
            });
        });

        window.addEventListener("message", event => {
            if (event.source !== iframe.contentWindow || event.origin !== window.location.origin) return;
            if (event.data?.channel !== "afrodite-potree") return;
            if (event.data.type === "profile-progress") {
                if (!profilePanel.hidden) {
                    profileChartData = event.data;
                    updateProfileMetrics(event.data.metrics);
                    profileStatus.textContent = event.data.status || "Processando os pontos do perfil...";
                    requestAnimationFrame(drawProfileChart);
                }
                return;
            }
            if (event.data.type === "profile-status") {
                profileInstructions.textContent = event.data.message || "";
                profileStatus.textContent = event.data.status || event.data.message || "";
                return;
            }
            if (event.data.type === "profile-close") {
                closeProfilePanel();
                return;
            }
            if (event.data.type !== "tool-state") return;
            if (event.data.action === "sample-elevation") {
                document.querySelector('[data-potree-action="sample-elevation"]')
                    ?.setAttribute("aria-pressed", String(event.data.active));
            }
            if (event.data.action === "profile") {
                document.querySelector('[data-potree-action="profile"]')
                    ?.setAttribute("aria-pressed", String(event.data.active));
            }
            if (event.data.action === "elevation" && event.data.palette) {
                elevationPaletteToggle.setAttribute("aria-pressed", "true");
                elevationPaletteMenu.querySelectorAll(".palette-option").forEach(button => {
                    button.setAttribute("aria-pressed", String(button.dataset.elevationPalette === event.data.palette));
                });
            }
            if (event.data.action === "rgb") {
                selectedElevationPalette = null;
                elevationPaletteToggle.setAttribute("aria-pressed", "false");
            }
        });

        function extrairData(nomeArquivo) {
            const match = nomeArquivo.match(/(?:^|[^\d])(\d{1,2})-(\d{1,2})-(\d{4})(?=[^\d]|$)/);
            if (!match) return null;

            const dia = Number(match[1]);
            const mes = Number(match[2]);
            const ano = Number(match[3]);
            const data = new Date(ano, mes - 1, dia);
            if (data.getFullYear() !== ano || data.getMonth() !== mes - 1 || data.getDate() !== dia) return null;
            return data;
        }

        function formatarData(data) {
            if (!data) return "Data não identificada";
            return new Intl.DateTimeFormat("pt-BR", { dateStyle: "short" }).format(data);
        }

        async function listarArquivos() {
            const arquivos = [];
            let cursor = null;

            do {
                const url = new URL(CONFIG.listUrl, window.location.href);
                if (cursor) url.searchParams.set("cursor", cursor);
                const resposta = await fetch(url);
                if (!resposta.ok) throw new Error(`Falha ao listar arquivos (HTTP ${resposta.status}).`);

                const dados = await resposta.json();
                if (!Array.isArray(dados.objects)) {
                    throw new Error("Resposta inválida do Worker: lista 'objects' ausente.");
                }

                for (const objeto of dados.objects) {
                    if (typeof objeto.key !== "string" || !objeto.key.toLowerCase().endsWith(".copc.laz")) continue;
                    const nomeArquivo = objeto.key.split("/").pop();
                    const caminho = objeto.key.split("/").map(encodeURIComponent).join("/");
                    arquivos.push({
                        nome: nomeArquivo,
                        data: extrairData(nomeArquivo),
                        url: `${CONFIG.publicBaseUrl.replace(/\/$/, "")}/${caminho}`,
                    });
                }

                if (dados.truncated && !dados.nextCursor) {
                    throw new Error("O Worker indicou mais arquivos, mas não informou o cursor da próxima página.");
                }
                cursor = dados.truncated ? dados.nextCursor : null;
            } while (cursor);

            arquivos.sort((a, b) => {
                const dataA = a.data ? a.data.getTime() : Number.NEGATIVE_INFINITY;
                const dataB = b.data ? b.data.getTime() : Number.NEGATIVE_INFINITY;
                return dataA - dataB || a.nome.localeCompare(b.nome);
            });
            return arquivos;
        }

        function montarBotaoArquivo(arquivo) {
            const botao = document.createElement("button");
            botao.className = "voo-btn";
            botao.type = "button";
            botao.title = arquivo.nome;
            botao.setAttribute("aria-label", `Abrir ${arquivo.nome}, ${formatarData(arquivo.data)}`);

            const data = document.createElement("span");
            data.className = "timeline-date";
            data.textContent = formatarData(arquivo.data);

            const marcador = document.createElement("span");
            marcador.className = "timeline-marker";
            marcador.setAttribute("aria-hidden", "true");

            botao.append(data, marcador);
            botao.addEventListener("click", () => selecionarArquivo(botao, arquivo.url));
            return botao;
        }

        function montarUrlViewer(urlArquivo) {
            const url = new URL(CONFIG.viewerBase, document.baseURI);
            url.searchParams.set("copc", urlArquivo);
            url.searchParams.set("embed", "1");
            return url.toString();
        }

        function selecionarArquivo(botaoSelecionado, urlArquivo) {
            closeProfilePanel();
            document.querySelectorAll(".voo-btn").forEach((botao) => botao.classList.remove("ativo"));
            botaoSelecionado.classList.add("ativo");
            document.querySelector('[data-potree-action="rgb"]')
                .setAttribute("aria-pressed", "false");
            document.querySelector('[data-potree-action="sample-elevation"]')
                ?.setAttribute("aria-pressed", "false");
            setElevationPaletteMenuOpen(false);
            loader.classList.remove("hidden");
            loader.querySelector("p").textContent = "Carregando nuvem de pontos...";
            iframe.src = montarUrlViewer(urlArquivo);
        }

        async function montarTimeline() {
            try {
                const arquivos = await listarArquivos();
                timeline.replaceChildren();

                if (!arquivos.length) {
                    statusTimeline.textContent = "Nenhum arquivo COPC foi encontrado.";
                    loader.classList.add("hidden");
                    return;
                }

                for (const arquivo of arquivos) timeline.appendChild(montarBotaoArquivo(arquivo));

                const arquivosComData = arquivos.filter((arquivo) => arquivo.data);
                const maisRecente = arquivosComData.at(-1) || arquivos.at(-1);
                statusTimeline.textContent = "";
                const botaoMaisRecente = timeline.children[arquivos.indexOf(maisRecente)];
                if (botaoMaisRecente) selecionarArquivo(botaoMaisRecente, maisRecente.url);
            } catch (erro) {
                console.error(erro);
                statusTimeline.textContent = `Erro ao carregar a lista: ${erro.message}`;
                loader.classList.add("hidden");
            }
        }

        iframe.addEventListener("load", () => {
            loader.classList.add("hidden");
            sendViewerCommand("mode", { mode: viewerMode });
            if (selectedElevationPalette) {
                sendViewerCommand("tool", { action: "elevation", palette: selectedElevationPalette });
            }
        });

        window.addEventListener("load", () => {
            montarTimeline();

            setTimeout(() => {
                document.getElementById("loading").classList.add("hidden");
                document.getElementById("topo").classList.add("visible");
                document.querySelector(".titulo-bar").classList.add("visible");
            }, TEMPO_SPLASH);
        });
    </script>

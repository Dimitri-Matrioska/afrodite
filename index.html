<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFRODITE | Visualizador LiDAR - Fernão Dias</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0c0e12; color: #fff; }

        /* Barra de Navegação Corporativa */
        #top-bar {
            position: absolute; top: 0; left: 0; width: 100%; height: 55px;
            background: rgba(12, 14, 18, 0.95); display: flex; align-items: center;
            justify-content: space-between; padding: 0 20px; z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .brand-title { font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #38bdf8; }

        .flight-select-container { display: flex; align-items: center; gap: 10px; }
        .flight-select-container label { font-size: 13px; color: #94a3b8; }
        .flight-select-container select {
            background: #1e293b; color: #f8fafc; border: 1px solid #334155;
            padding: 6px 12px; border-radius: 6px; outline: none; cursor: pointer; font-size: 13px;
        }

        /* iFrame da Engine do OpenLidarViewer */
        #viewer-frame {
            position: absolute; top: 55px; left: 0;
            width: 100%; height: calc(100% - 55px);
            border: none;
        }
    </style>
</head>
<body>

    <header id="top-bar">
        <div class="brand-title">AFRODITE | LEVANTAMENTO LIDAR</div>
        <div class="flight-select-container">
            <label for="date-select">Data do Voo:</label>
            <select id="date-select" onchange="changeFlight(this.value)">
                <option value="8-11-2026">08/11/2026 - Rodovia Fernão Dias</option>
                <option value="01-11-2026">01/11/2026 - Rodovia Fernão Dias</option>
            </select>
        </div>
    </header>

    <iframe id="viewer-frame" allow="gpu; accelerometer; gyroscope; autoplay" allowfullscreen></iframe>

    <script>
        function loadPointCloud(dateString) {
            const lazUrl = `https://dimitri-matrioska.github.io/afrodite/Rodovia-Ferno-Dias-${dateString}-georeferenced_model.copc.laz`;
            
            // Passa a URL do arquivo no padrão de hash suportado pelo OpenLidarViewer
            const targetUrl = `https://lidar.aurtech.mx/#copc=${encodeURIComponent(lazUrl)}`;
            
            document.getElementById('viewer-frame').src = targetUrl;
        }

        function changeFlight(selectedDate) {
            loadPointCloud(selectedDate);
        }

        // Carrega o voo inicial
        loadPointCloud('8-11-2026');
    </script>
</body>
</html>

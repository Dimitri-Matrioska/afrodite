<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Visualizador de Nuvem de Pontos</title>

	<link rel="stylesheet" type="text/css" href="./potree/potree.css">
	<link rel="stylesheet" type="text/css" href="./libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="./libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="./libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="./libs/jstree/themes/mixed/style.css">

	<style>
		html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: "Segoe UI", Arial, sans-serif; }

		/* ---------- painel de arquivos ---------- */
		#painel-arquivos {
			position: absolute; top: 12px; right: 12px; z-index: 1000;
			width: 300px; max-height: calc(100% - 24px);
			background: rgba(20, 24, 30, 0.92); color: #e8eaed;
			border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.45);
			display: flex; flex-direction: column; overflow: hidden;
			backdrop-filter: blur(4px);
		}
		#painel-arquivos .cabecalho {
			padding: 12px 14px 8px 14px; border-bottom: 1px solid rgba(255,255,255,.08);
		}
		#painel-arquivos h1 { font-size: 15px; margin: 0 0 2px 0; font-weight: 600; }
		#painel-arquivos .sub { font-size: 11px; color: #9aa0a6; }
		#busca {
			margin: 10px 14px; padding: 7px 10px; width: calc(100% - 28px);
			border: 1px solid rgba(255,255,255,.15); border-radius: 6px;
			background: rgba(255,255,255,.06); color: #e8eaed; outline: none; font-size: 13px;
		}
		#busca::placeholder { color: #80868b; }
		#lista-nuvens { overflow-y: auto; padding: 0 8px 10px 8px; flex: 1; }
		.item-nuvem {
			padding: 9px 10px; margin: 4px 0; border-radius: 7px; cursor: pointer;
			border: 1px solid transparent; transition: background .15s;
		}
		.item-nuvem:hover { background: rgba(255,255,255,.07); }
		.item-nuvem.ativo { background: rgba(66,133,244,.25); border-color: rgba(66,133,244,.6); }
		.item-nuvem .nome { font-size: 13px; font-weight: 500; }
		.item-nuvem .detalhe { font-size: 11px; color: #9aa0a6; margin-top: 2px; word-break: break-all; }
		#status-lista { padding: 14px; font-size: 12px; color: #9aa0a6; text-align: center; }

		/* ---------- barra de ferramentas rápida ---------- */
		#barra-rapida {
			position: absolute; top: 12px; right: 326px; z-index: 1000;
			display: flex; gap: 6px;
		}
		#barra-rapida button {
			background: rgba(20,24,30,.92); color: #e8eaed; border: 1px solid rgba(255,255,255,.12);
			border-radius: 7px; padding: 7px 12px; font-size: 12px; cursor: pointer;
		}
		#barra-rapida button:hover { background: rgba(66,133,244,.35); }

		body.embedded #painel-arquivos,
		body.embedded #barra-rapida { display: none; }

		body.embedded {
			--color-0: #10192e;
			--color-1: #f0c089;
			--color-2: #1b2a4a;
			--color-3: #3d4fe8;
			--color-4: #f5f1eb;
			--bg-color: var(--color-0);
			--bg-color-2: #1b2a4a;
			--bg-light-color: #1b2a4a;
			--bg-dark-color: #10192e;
			--bg-hover-color: #3d4fe8;
			--font-color: #f5f1eb;
			--font-color-2: #ffffff;
			--border-color: #3d4fe8;
		}

		body.embedded #potree_sidebar_container {
			z-index: 1001;
			border-right-color: rgba(240, 192, 137, 0.35);
			box-shadow: 8px 0 28px rgba(0, 0, 0, 0.22);
		}

		body.embedded #potree_quick_buttons {
			display: none !important;
		}

		body.embedded:not(.advanced) #potree_sidebar_container {
			display: none !important;
		}

		/* ---------- status de carregamento ---------- */
		#carregando {
			position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
			z-index: 1000; background: rgba(20,24,30,.92); color: #e8eaed;
			padding: 8px 18px; border-radius: 20px; font-size: 13px; display: none;
		}
		#erro {
			position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
			z-index: 1001; background: rgba(160,30,30,.95); color: #fff;
			padding: 10px 18px; border-radius: 8px; font-size: 13px; display: none; max-width: 70%;
		}
		#elevation-sample-result {
			position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
			z-index: 1001; max-width: min(90%, 460px); padding: 10px 16px;
			border: 1px solid rgba(240,192,137,.55); border-radius: 10px;
			background: rgba(16,25,46,.94); color: #f5f1eb; font-size: 13px;
			text-align: center; box-shadow: 0 4px 18px rgba(0,0,0,.3);
			display: none; pointer-events: auto; touch-action: manipulation;
		}
		.elevation-radius-button {
			pointer-events: auto !important;
			transition: transform .12s ease, background .12s ease, border-color .12s ease;
		}
		.elevation-radius-button:hover {
			transform: translateY(-1px);
		}
		@keyframes pulse {
			0% { transform: scale(0.8); opacity: 0.7; }
			50% { transform: scale(1.1); opacity: 1; }
			100% { transform: scale(0.8); opacity: 0.7; }
		}
	</style>
</head>
<body>

	<script src="./libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="./libs/spectrum/spectrum.js"></script>
	<script src="./libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="./libs/other/BinaryHeap.js"></script>
	<script src="./libs/tween/tween.min.js"></script>
	<script src="./libs/d3/d3.js"></script>
	<script src="./libs/proj4/proj4.js"></script>
	<script src="./libs/openlayers3/ol.js"></script>
	<script src="./libs/i18next/i18next.js"></script>
	<script src="./libs/jstree/jstree.js"></script>
	<script src="./libs/copc/index.js"></script>
	<script src="./potree/potree.js"></script>

	<!-- ================= PAINEL DE ARQUIVOS ================= -->
	<div id="painel-arquivos">
		<div class="cabecalho">
			<h1>Nuvens de Pontos</h1>
			<div class="sub">Selecione um arquivo para visualizar</div>
		</div>
		<input id="busca" type="text" placeholder="Buscar nuvem...">
		<div id="lista-nuvens"><div id="status-lista">Carregando lista...</div></div>
	</div>

	<!-- ================= BARRA RÁPIDA ================= -->
	<div id="barra-rapida">
		<button id="btn-enquadrar" title="Enquadrar a nuvem inteira na tela">⤢ Enquadrar</button>
		<button id="btn-elevacao" title="Colorir pontos por cota/elevação">▲ Elevação</button>
		<button id="btn-rgb" title="Colorir pelas cores originais (RGB)">🎨 RGB</button>
		<button id="btn-limpar" title="Remover todas as medições">✕ Limpar medições</button>
	</div>

	<div id="carregando">Carregando nuvem de pontos…</div>
	<div id="erro"></div>
	<div id="elevation-sample-result" role="status" aria-live="polite"></div>

	<!-- ================= ÁREA DO VISUALIZADOR ================= -->
	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0; top: 0;">
		<div id="potree_render_area" style="background-image: url('./potree/resources/images/background.jpg');"></div>
		<div id="potree_sidebar_container"></div>
	</div>

	<script type="module">
	import * as THREE from "./libs/three.js/build/three.module.js";

	if (new URLSearchParams(window.location.search).get("embed") === "1") {
		document.body.classList.add("embedded");
	}

	/* ============================================================
	 *  CONFIGURAÇÃO — EDITE AQUI
	 * ============================================================
	 *  MODO 1 (padrão): a página lê o arquivo "nuvens.json" no mesmo
	 *  servidor. Basta manter esse JSON atualizado com as suas nuvens:
	 *
	 *     { "nuvens": [ { "nome": "Talhão 1", "url": "https://seu-servidor/talhao1/metadata.json" } ] }
	 *
	 *  Formatos aceitos na URL:
	 *     • metadata.json  → formato Potree 2.0 (PotreeConverter 2.x)
	 *     • cloud.js       → formato Potree 1.x (PotreeConverter 1.x)
	 *     • ept.json       → Entwine Point Tiles
	 *     • *.copc.laz     → COPC (LAZ otimizado para nuvem)
	 *  A página externa pode passar ?copc=<URL codificada> para abrir um COPC automaticamente.
	 *
	 *  MODO 2 (Cloudflare R2): configure o endpoint do Worker em
	 *  r2.listUrl e o endereço público do bucket em r2.publicBaseUrl.
	 *  O Worker precisa estar vinculado ao bucket (veja worker-r2-list.js).
	 *
	 *  MODO 3 (Firebase Storage): preencha firebase.bucket e
	 *  firebase.prefix.
	 * ============================================================ */
	const CONFIG = {
		manifestUrl: "./nuvens.json",     // MODO 1
		r2: {                              // MODO 2 (Cloudflare R2)
			listUrl: "https://listar-nuvens-potree.matrioska-dev.workers.dev/api/nuvens",
			publicBaseUrl: "https://pub-ff165ed52c304df59d57ae2f21220e3c.r2.dev"
		},
		firebase: {                        // MODO 3 (deixe bucket vazio para desativar)
			bucket: "",                    // ex.: "meu-projeto.appspot.com"
			prefix: "nuvens/"              // pasta dentro do bucket
		}
	};

	/* ------------------- inicialização do viewer ------------------- */
	const renderArea = document.getElementById("potree_render_area");
	window.viewer = new Potree.Viewer(renderArea);
	const elevationSampleResult = document.getElementById("elevation-sample-result");
	let elevationSamplingActive = false;
	let elevationSamplePreview = null;
	let elevationSampleMarker = null;
	let elevationSampleRing = null;
	let elevationPreviewPointer = null;
	let elevationPreviewTimer = null;
	const ELEVATION_SAMPLE_RADII = [2, 5, 10, 15, 20];
	let currentElevationSampleRadius = 10;
	const elevationSampleLabels = new Set();
	let activeElevationPalette = null;
	let activeElevationProfile = null;
	let profileDrawingActive = false;
	let profileContextMenuHandler = null;
	let profileRequests = [];
	let profileGeneration = 0;

	function postProfileMessage(type, details = {}) {
		if (window.parent === window) return;
		window.parent.postMessage({
			channel: "afrodite-potree",
			type,
			...details
		}, window.location.origin);
	}

	function setProfileDrawingActive(active) {
		profileDrawingActive = active;
		postProfileMessage("tool-state", {
			action: "profile",
			active
		});
	}

	function stopElevationProfile(notifyParent = false) {
		const wasDrawing = profileDrawingActive;
		profileGeneration++;
		profileDrawingActive = false;
		const domElement = viewer.renderer.domElement;
		if (profileContextMenuHandler) {
			domElement.removeEventListener("contextmenu", profileContextMenuHandler, true);
			profileContextMenuHandler = null;
		}

		if (wasDrawing) viewer.dispatchEvent({ type: "cancel_insertions" });
		const requests = profileRequests;
		profileRequests = [];
		for (const request of requests) request.cancel();
		if (activeElevationProfile && viewer.scene.profiles.includes(activeElevationProfile)) {
			viewer.scene.removeProfile(activeElevationProfile);
		}
		activeElevationProfile = null;
		postProfileMessage("tool-state", { action: "profile", active: false });
		if (notifyParent) postProfileMessage("profile-close");
	}

	function formatProfileMetrics(profile) {
		const points = profile.points;
		let horizontalDistance = 0;
		for (let i = 1; i < points.length; i++) {
			const dx = points[i].x - points[i - 1].x;
			const dy = points[i].y - points[i - 1].y;
			horizontalDistance += Math.hypot(dx, dy);
		}
		const startElevation = points[0].z;
		const endElevation = points[points.length - 1].z;
		const deltaZ = endElevation - startElevation;
		const angleDegrees = horizontalDistance > 0
			? Math.atan2(deltaZ, horizontalDistance) * 180 / Math.PI
			: null;
		return {
			distance: horizontalDistance,
			deltaZ,
			startElevation,
			endElevation,
			slopePercent: horizontalDistance > 0 ? deltaZ / horizontalDistance * 100 : null,
			angleDegrees
		};
	}

	function createElevationProfile(profile) {
		if (!viewer.scene.pointclouds.some(pointcloud => pointcloud.visible)) {
			postProfileMessage("profile-status", {
				message: "Carregue uma nuvem antes de medir.",
				status: "Nenhuma nuvem de pontos está carregada."
			});
			setProfileDrawingActive(false);
			return;
		}

		const metrics = formatProfileMetrics(profile);
		if (metrics.distance <= 0) {
			postProfileMessage("profile-status", {
				message: "Os pontos inicial e final precisam ser diferentes.",
				status: "O perfil não tem distância horizontal."
			});
			return;
		}

		const generation = profileGeneration;
		const binWidth = Math.max(metrics.distance / 600, 0.25);
		const bins = new Map();
		let pendingRequests = 0;
		let totalPoints = 0;

		const publish = finished => {
			if (generation !== profileGeneration) return;
			const samples = Array.from(bins.values())
				.sort((a, b) => a.distance / a.count - b.distance / b.count)
				.map(bin => ({
					distance: bin.distance / bin.count,
					elevation: bin.elevation / bin.count
				}));
			postProfileMessage("profile-progress", {
				metrics,
				samples,
				status: finished
					? (totalPoints ? `${totalPoints.toLocaleString("pt-BR")} pontos processados.` : "Nenhum ponto encontrado no corredor. Tente uma linha mais próxima da nuvem.")
					: `${totalPoints.toLocaleString("pt-BR")} pontos encontrados; refinando o perfil...`,
				finished
			});
		};

		const collect = (pointcloud, profileData) => {
			for (const segment of profileData.segments) {
				const pointData = segment.points.data;
				const positions = pointData.position;
				const mileages = pointData.mileage;
				if (!positions || !mileages) continue;
				const pointCount = segment.points.numPoints;
				const cloudZ = pointcloud.position.z;
				for (let i = 0; i < pointCount; i++) {
					const distance = Math.max(0, Math.min(metrics.distance, mileages[i]));
					const key = Math.floor(distance / binWidth);
					let bin = bins.get(key);
					if (!bin) {
						bin = { distance: 0, elevation: 0, count: 0 };
						bins.set(key, bin);
					}
					bin.distance += distance;
					bin.elevation += positions[i * 3 + 2] + cloudZ;
					bin.count++;
				}
				totalPoints += pointCount;
			}
		};

		const pointclouds = viewer.scene.pointclouds.filter(pointcloud => pointcloud.visible);
		pendingRequests = pointclouds.length;
		postProfileMessage("profile-progress", {
			metrics,
			samples: [],
			status: "Buscando pontos no corredor do perfil...",
			finished: false
		});

		for (const pointcloud of pointclouds) {
			let request;
			try {
				request = pointcloud.getPointsInProfile(profile, null, {
					onProgress: event => {
						if (generation !== profileGeneration) return;
						collect(pointcloud, event.points);
						publish(false);
					},
					onFinish: () => {
						profileRequests = profileRequests.filter(activeRequest => activeRequest !== request);
						if (generation !== profileGeneration) return;
						pendingRequests--;
						if (pendingRequests === 0) publish(true);
					},
					onCancel: () => {
						profileRequests = profileRequests.filter(activeRequest => activeRequest !== request);
					}
				});
				profileRequests.push(request);
			} catch (error) {
				console.error("Falha ao processar o perfil de elevação:", error);
				pendingRequests--;
				if (pendingRequests === 0) {
					postProfileMessage("profile-status", {
						message: "Não foi possível processar o perfil.",
						status: error.message
					});
				}
			}
		}
	}

	function finishElevationProfile() {
		if (!profileDrawingActive) return;
		profileDrawingActive = false;
		const domElement = viewer.renderer.domElement;
		if (profileContextMenuHandler) {
			domElement.removeEventListener("contextmenu", profileContextMenuHandler, true);
			profileContextMenuHandler = null;
		}

		const profile = activeElevationProfile;
		if (!profile || profile.points.length < 2) {
			stopElevationProfile(true);
			return;
		}
		setProfileDrawingActive(false);
		postProfileMessage("profile-status", {
			message: "Perfil desenhado.",
			status: "Extraindo as cotas da nuvem..."
		});
		createElevationProfile(profile);
	}

	function beginElevationProfile() {
		stopElevationProfile(false);
		if (!viewer.scene.pointclouds.some(pointcloud => pointcloud.visible)) {
			postProfileMessage("profile-status", {
				message: "Carregue uma nuvem antes de medir.",
				status: "Nenhuma nuvem de pontos está carregada."
			});
			return;
		}

		activeElevationProfile = viewer.profileTool.startInsertion({ name: "Perfil de elevação" });
		setProfileDrawingActive(true);
		const domElement = viewer.renderer.domElement;
		profileContextMenuHandler = event => {
			if (!profileDrawingActive) return;
			event.preventDefault();
			finishElevationProfile();
		};
		domElement.addEventListener("contextmenu", profileContextMenuHandler, true);
		postProfileMessage("profile-status", {
			message: "Desenhe a linha.",
			status: "Clique para marcar os pontos e use o botão direito para concluir."
		});
	}

	function setElevationSamplingActive(active) {
		elevationSamplingActive = active;
		if (window.parent !== window) {
			window.parent.postMessage({
				channel: "afrodite-potree",
				type: "tool-state",
				action: "sample-elevation",
				active
			}, window.location.origin);
		}
	}

	function renderElevationRadiusSelector(message = "Selecione o raio da área de amostragem.") {
		const buttons = ELEVATION_SAMPLE_RADII.map(radius => {
			const active = radius === currentElevationSampleRadius ? "active" : "";
			return `<button type="button" class="elevation-radius-button ${active}" data-radius="${radius}" style="background:${active ? '#ff5a5f' : 'rgba(255,255,255,0.08)'}; color:#fff; border:1px solid rgba(255,255,255,0.15); border-radius:999px; padding:4px 8px; font-size:11px; cursor:pointer;">${radius}m</button>`;
		}).join("");
		elevationSampleResult.innerHTML = `
			<div style="display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-bottom:8px;">${buttons}</div>
			<div style="font-weight:600; letter-spacing:0.02em;">${message}</div>
		`;
		elevationSampleResult.querySelectorAll(".elevation-radius-button").forEach(button => {
			button.addEventListener("pointerdown", event => {
				event.preventDefault();
				event.stopPropagation();
			});
			button.addEventListener("click", event => {
				event.preventDefault();
				event.stopPropagation();
				currentElevationSampleRadius = Number(button.dataset.radius);
				renderElevationRadiusSelector(`Raio ativo: ${currentElevationSampleRadius} m`);
				if (elevationSampleRing) {
					const ringPoints = [];
					for (let i = 0; i <= 48; i++) {
						const angle = (i / 48) * Math.PI * 2;
						ringPoints.push(new THREE.Vector3(Math.cos(angle) * currentElevationSampleRadius, Math.sin(angle) * currentElevationSampleRadius, 0));
					}
					elevationSampleRing.geometry.dispose();
					elevationSampleRing.geometry = new THREE.BufferGeometry().setFromPoints(ringPoints);
					elevationSampleRing.visible = true;
				}
			});
		});
		elevationSampleResult.style.display = "block";
	}

	function stopElevationSampleMode(message = null, hideResult = false) {
		setElevationSamplingActive(false);
		clearTimeout(elevationPreviewTimer);
		elevationPreviewTimer = null;
		elevationPreviewPointer = null;
		clearElevationSamplePreview();
		if (message !== null) {
			showElevationSampleMessage(message);
		} else if (hideResult) {
			elevationSampleResult.style.display = "none";
		}
	}

	function showElevationSampleMessage(message) {
		elevationSampleResult.textContent = message;
		elevationSampleResult.style.display = "block";
	}

	function showElevationProcessingIndicator(progress = 0) {
		const safeProgress = Math.max(0, Math.min(100, Number.isFinite(progress) ? progress : 0));
		elevationSampleResult.innerHTML = `
			<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-width:220px;">
				<div style="display:flex; align-items:center; justify-content:center; gap:8px; width:100%;">
					<span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#ffb703; box-shadow:0 0 12px rgba(255,183,3,0.8); animation:pulse 1s infinite;"> </span>
					<span>Processando elevação em ${currentElevationSampleRadius} m...</span>
				</div>
				<div style="width:100%; height:8px; border-radius:999px; background:rgba(255,255,255,0.08); overflow:hidden; border:1px solid rgba(255,255,255,0.1);">
					<div style="width:${safeProgress}%; height:100%; border-radius:999px; background:linear-gradient(90deg, #ffb703, #ff5a5f); transition:width .15s ease-out;"></div>
				</div>
				<span style="font-size:11px; color:#dfe3eb;">${Math.round(safeProgress)}%</span>
			</div>
		`;
		elevationSampleResult.style.display = "block";
	}

	function clearElevationSamplePreview() {
		if (elevationSampleMarker) {
			viewer.scene.scene.remove(elevationSampleMarker);
			elevationSampleMarker = null;
		}
		if (elevationSampleRing) {
			viewer.scene.scene.remove(elevationSampleRing);
			elevationSampleRing = null;
		}
		if (elevationSamplePreview) {
			viewer.scene.removeMeasurement(elevationSamplePreview);
			elevationSamplePreview = null;
		}
	}

	const ELEVATION_SAMPLE_PREVIEW_LIMIT = 1;
	const MIN_ELEVATION_SAMPLES = 50;
	const MAX_ELEVATION_SAMPLES = 50;
	const ELEVATION_SAMPLE_RING_OFFSET_Z = 0.25;

	function computeMedian(values) {
		if (!values.length) return null;
		const sorted = [...values].sort((a, b) => a - b);
		const middle = Math.floor(sorted.length / 2);
		if (sorted.length % 2 === 0) {
			return (sorted[middle - 1] + sorted[middle]) / 2;
		}
		return sorted[middle];
	}

	function computeRobustMedian(values) {
		if (!values.length) return null;
		const sorted = [...values].sort((a, b) => a - b);
		const trimCount = Math.max(1, Math.floor(sorted.length * 0.1));
		const trimmed = sorted.slice(trimCount, sorted.length - trimCount);
		const source = trimmed.length ? trimmed : sorted;
		return computeMedian(source);
	}

	function beginElevationSamplePreview() {
		clearElevationSamplePreview();

		const markerMaterial = new THREE.MeshBasicMaterial({
			color: 0xffcc66,
			transparent: true,
			opacity: 0.95
		});
		elevationSampleMarker = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 12), markerMaterial);
		elevationSampleMarker.visible = false;
		viewer.scene.scene.add(elevationSampleMarker);

		const ringMaterial = new THREE.LineBasicMaterial({
			color: 0xff3b30,
			transparent: true,
			opacity: 1,
			linewidth: 3
		});
		const ringPoints = [];
		for (let i = 0; i <= 48; i++) {
			const angle = (i / 48) * Math.PI * 2;
			ringPoints.push(new THREE.Vector3(Math.cos(angle) * currentElevationSampleRadius, Math.sin(angle) * currentElevationSampleRadius, 0));
		}
		elevationSampleRing = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(ringPoints), ringMaterial);
		elevationSampleRing.visible = false;
		viewer.scene.scene.add(elevationSampleRing);
	}

	function updateElevationSampleCursorPreview(center, valueZ = null) {
		if (!elevationSampleMarker || !elevationSampleRing) return;
		elevationSampleMarker.visible = true;
		elevationSampleMarker.position.copy(center);
		const previewZ = valueZ !== null ? valueZ + ELEVATION_SAMPLE_RING_OFFSET_Z : center.z + ELEVATION_SAMPLE_RING_OFFSET_Z;
		elevationSampleMarker.position.z = previewZ;
		elevationSampleRing.visible = true;
		elevationSampleRing.position.copy(center);
		elevationSampleRing.position.z = previewZ;
	}

	function findElevationSamples(anchor, pointcloud, radius = currentElevationSampleRadius) {
		const radiusSquared = radius * radius;
		const samples = [];

		pointcloud.updateMatrixWorld(true);
		for (const node of new Set(pointcloud.visibleNodes || [])) {
			const positions = node.geometryNode?.geometry?.attributes?.position;
			const sceneNode = node.sceneNode;
			if (!positions || !sceneNode) continue;

			sceneNode.updateMatrixWorld(true);
			const matrix = sceneNode.matrixWorld.elements;
			const values = positions.array;
			for (let i = 0; i < positions.count; i++) {
				const index = i * positions.itemSize;
				const x = values[index];
				const y = values[index + 1];
				const z = values[index + 2];
				const worldX = matrix[0] * x + matrix[4] * y + matrix[8] * z + matrix[12];
				const worldY = matrix[1] * x + matrix[5] * y + matrix[9] * z + matrix[13];
				const worldZ = matrix[2] * x + matrix[6] * y + matrix[10] * z + matrix[14];
				const dx = worldX - anchor.x;
				const dy = worldY - anchor.y;
				const distanceSquared = dx * dx + dy * dy;
				if (distanceSquared > radiusSquared) continue;

				samples.push({
					x: worldX,
					y: worldY,
					z: worldZ,
					distanceSquared,
					position: { x: worldX, y: worldY, z: worldZ }
				});
			}
		}

		return samples.sort((a, b) => a.distanceSquared - b.distanceSquared);
	}

	function refreshElevationSamplePreview() {
		elevationPreviewTimer = null;
		if (!elevationSamplingActive || !elevationSampleMarker || !elevationSampleRing || !elevationPreviewPointer) return;

		const { x, y } = elevationPreviewPointer;
		const rect = viewer.renderer.domElement.getBoundingClientRect();
		const intersection = Potree.Utils.getMousePointCloudIntersection(
			{ x: x - rect.left, y: y - rect.top },
			viewer.scene.getActiveCamera(),
			viewer,
			viewer.scene.pointclouds
		);
		if (!intersection) {
			elevationSampleMarker.visible = false;
			elevationSampleRing.visible = false;
			return;
		}

		updateElevationSampleCursorPreview(intersection.location, intersection.location.z);
		renderElevationRadiusSelector(`Raio ativo: ${currentElevationSampleRadius} m — clique para calcular a elevação.`);
	}

	function clearViewerMeasurements() {
		stopElevationProfile(true);
		viewer.dispatchEvent({ type: "cancel_insertions" });
		stopElevationSampleMode(null, true);
		viewer.scene.removeAllMeasurements();
		elevationSampleLabels.clear();
		elevationSampleResult.style.display = "none";
	}

	function sampleAverageElevation(anchor, pointcloud) {
		return new Promise((resolve, reject) => {
			const radius = currentElevationSampleRadius;
			const profile = new Potree.Profile();
			profile.name = "Amostragem de elevação";
			profile.setWidth(Math.max(1, radius * 1.25));
			const start = new THREE.Vector3(anchor.x - radius, anchor.y, anchor.z + ELEVATION_SAMPLE_RING_OFFSET_Z);
			const end = new THREE.Vector3(anchor.x + radius, anchor.y, anchor.z + ELEVATION_SAMPLE_RING_OFFSET_Z);
			profile.addMarker(start);
			profile.addMarker(end);

			const selected = [];
			showElevationProcessingIndicator(5);

			const request = pointcloud.getPointsInProfile(profile, null, {
				onProgress: event => {
					if (!event?.points?.segments) return;
					for (const segment of event.points.segments) {
						const pointData = segment?.points?.data;
						if (!pointData || !pointData.position) continue;
						const values = pointData.position;
						const count = segment.points.numPoints || Math.floor(values.length / 3);
						for (let i = 0; i < count; i++) {
							const index = i * 3;
							const px = values[index];
							const py = values[index + 1];
							const pz = values[index + 2];
							if (!Number.isFinite(px) || !Number.isFinite(py) || !Number.isFinite(pz)) continue;

							const dx = px - anchor.x;
							const dy = py - anchor.y;
							const distanceSquared = dx * dx + dy * dy;
							if (distanceSquared > radius * radius) continue;
							if (Math.abs(pz - anchor.z) > radius * 0.5) continue;

							const candidate = { distanceSquared, z: pz };
							if (selected.length < MAX_ELEVATION_SAMPLES) {
								selected.push(candidate);
							} else {
								const randomIndex = Math.floor(Math.random() * (selected.length + 1));
								if (randomIndex < MAX_ELEVATION_SAMPLES) {
									selected[randomIndex] = candidate;
								}
							}
						}
					}

					if (selected.length >= MIN_ELEVATION_SAMPLES) {
						showElevationProcessingIndicator(90);
					} else {
						const progress = Math.min(89, Math.round((selected.length / MIN_ELEVATION_SAMPLES) * 100));
						showElevationProcessingIndicator(progress || 5);
					}
				},
				onFinish: () => {
					if (selected.length < MIN_ELEVATION_SAMPLES) {
						reject(new Error("Não foi possível encontrar pelo menos 50 pontos próximos nessa região."));
						return;
					}
					showElevationProcessingIndicator(100);
					const elevations = selected
						.sort((a, b) => a.distanceSquared - b.distanceSquared)
						.slice(0, MAX_ELEVATION_SAMPLES)
						.map(item => item.z);
					const robustMedianZ = computeRobustMedian(elevations);
					const formattedZ = new Intl.NumberFormat("pt-BR", {
						minimumFractionDigits: 2,
						maximumFractionDigits: 2
					}).format(robustMedianZ);

					const measurement = new Potree.Measure();
					measurement.name = `Elevação média: ${formattedZ} m`;
					measurement.position.copy(anchor);
					measurement.showEdges = false;
					measurement.showDistances = false;
					measurement.maxMarkers = 1;
					measurement.addMarker([0, 0, 0]);
					const label = new Potree.TextSprite(`Elevação média: ${formattedZ} m`);
					label.setTextColor({ r: 255, g: 255, b: 255, a: 1 });
					label.setBackgroundColor({ r: 0, g: 0, b: 0, a: 1 });
					label.setBorderColor({ r: 0, g: 0, b: 0, a: 1 });
					label.fontsize = 16;
					label.update();
					label.position.set(0, 0, 1.5);
					measurement.add(label);
					viewer.scene.addMeasurement(measurement);
					elevationSampleLabels.add(label);
					//showElevationSampleMessage(
						//`Elevação estimada em raio de ${currentElevationSampleRadius} m: ${formattedZ} m — ${elevations.length} pontos amostrados (mín. 50 / máx. 50).`
					//);
					resolve({ elevations, z: robustMedianZ });
				},
				onCancel: () => {
					reject(new Error("A coleta do perfil foi cancelada."));
				}
			});
		});
	}

	function applyElevationPalette(paletteName) {
		const palette = Potree.Gradients[paletteName];
		if (!palette) {
			console.warn("Paleta de elevação Potree não reconhecida:", paletteName);
			return;
		}
		activeElevationPalette = paletteName;
		viewer.scene.pointclouds.forEach(pointcloud => {
			pointcloud.material.gradient = palette;
			pointcloud.material.activeAttributeName = "elevation";
		});
		if (window.parent !== window) {
			window.parent.postMessage({
				channel: "afrodite-potree",
				type: "tool-state",
				action: "elevation",
				palette: paletteName
			}, window.location.origin);
		}
	}

	viewer.scene.addEventListener("pointcloud_added", () => {
		if (activeElevationPalette) applyElevationPalette(activeElevationPalette);
	});

	window.addEventListener("message", event => {
		if (event.source !== window.parent || event.origin !== window.location.origin) return;
		if (event.data?.channel !== "afrodite-potree") return;

		if (event.data.type === "mode") {
			document.body.classList.toggle("advanced", event.data.mode === "advanced");
			return;
		}

		if (event.data.type !== "tool") return;
		if (event.data.action !== "sample-elevation" && elevationSamplingActive) {
			setElevationSamplingActive(false);
			clearElevationSamplePreview();
			showElevationSampleMessage("Amostragem de elevação cancelada.");
		}
		switch (event.data.action) {
			case "fit":
				viewer.fitToScreen(0.6);
				break;
			case "distance":
				viewer.measuringTool.startInsertion({
					showDistances: true,
					showArea: false,
					closed: false,
					name: "Distance"
				});
				break;
			case "area":
				viewer.measuringTool.startInsertion({
					showDistances: true,
					showArea: true,
					closed: true,
					name: "Area"
				});
				break;
			case "profile":
				beginElevationProfile();
				break;
			case "profile-close":
				stopElevationProfile(true);
				break;
			case "elevation":
				applyElevationPalette(event.data.palette || "SPECTRAL");
				break;
			case "rgb":
				activeElevationPalette = null;
				viewer.scene.pointclouds.forEach(pointcloud => {
					pointcloud.material.activeAttributeName = "rgba";
				});
				if (window.parent !== window) {
					window.parent.postMessage({
						channel: "afrodite-potree",
						type: "tool-state",
						action: "rgb"
					}, window.location.origin);
				}
				break;
			case "sample-elevation":
				if (elevationSamplingActive) {
					stopElevationSampleMode("Amostragem de elevação cancelada.");
				} else if (!viewer.scene.pointclouds.length) {
					showElevationSampleMessage("Carregue uma nuvem antes de medir a elevação média.");
				} else {
					beginElevationSamplePreview();
					elevationSampleResult.style.display = "block";
					renderElevationRadiusSelector(`Raio ativo: ${currentElevationSampleRadius} m — clique na nuvem para calcular a elevação.`);
					setElevationSamplingActive(true);
				}
				break;
			case "clear-measurements":
				clearViewerMeasurements();
				break;
			default:
				console.warn("Ferramenta Potree não reconhecida:", event.data.action);
		}
	});

	viewer.renderer.domElement.addEventListener("mousemove", event => {
		if (!elevationSamplingActive || !elevationSampleMarker || !elevationSampleRing) return;
		elevationPreviewPointer = { x: event.clientX, y: event.clientY };
		if (elevationPreviewTimer === null) {
			elevationPreviewTimer = setTimeout(refreshElevationSamplePreview, 80);
		}
	}, true);

	viewer.renderer.domElement.addEventListener("click", async event => {
		if (!elevationSamplingActive || event.button !== 0) return;
		const rect = viewer.renderer.domElement.getBoundingClientRect();
		const mouse = new THREE.Vector2(event.clientX - rect.left, event.clientY - rect.top);
		const intersection = Potree.Utils.getMousePointCloudIntersection(
			mouse,
			viewer.scene.getActiveCamera(),
			viewer,
			viewer.scene.pointclouds
		);
		if (!intersection) {
			showElevationSampleMessage("Não encontrei a nuvem nesse ponto. Tente clicar sobre ela.");
			return;
		}

		stopElevationSampleMode();
		try {
			await sampleAverageElevation(intersection.location, intersection.pointcloud);
		} catch (error) {
			showElevationSampleMessage(error.message);
			console.error("Falha ao calcular a elevação média:", error);
		}
	}, true);

	viewer.addEventListener("update", () => {
		for (const measurement of viewer.scene.measurements) {
			if (measurement.name !== "Prévia da elevação média" && !measurement.name.startsWith("Elevação média:")) continue;
			measurement.spheres.forEach((sphere, index) => {
				sphere.scale.multiplyScalar(index === 4 ? 0.55 : 0.3);
			});
		}
		if (!elevationSampleLabels.size) return;
		const camera = viewer.scene.getActiveCamera();
		const renderSize = viewer.renderer.getSize(new THREE.Vector2());
		for (const label of elevationSampleLabels) {
			if (!label.parent) {
				elevationSampleLabels.delete(label);
				continue;
			}
			const position = label.getWorldPosition(new THREE.Vector3());
			const distance = camera.position.distanceTo(position);
			const projectedRadius = Potree.Utils.projectedRadius(
				1, camera, distance, renderSize.width, renderSize.height
			);
			label.scale.setScalar(70 / projectedRadius);
		}
	});

	viewer.setEDLEnabled(true);
	viewer.setFOV(60);
	viewer.setPointBudget(500000);
	viewer.setDescription("");
	viewer.loadSettingsFromURL();

	viewer.loadGUI(() => {
		viewer.setLanguage("pt");
		$("#menu_appearance").next().show();
		$("#menu_tools").next().show();
	});

	/* ------------------- carregamento da lista ------------------- */
	const elLista  = document.getElementById("lista-nuvens");
	const elStatus = document.getElementById("status-lista");
	const elCarregando = document.getElementById("carregando");
	const elErro = document.getElementById("erro");

	function mostrarErro(msg) {
		elErro.textContent = msg;
		elErro.style.display = "block";
		setTimeout(() => elErro.style.display = "none", 9000);
	}

	async function listarNuvens() {
		// MODO 2 — Cloudflare R2 listado por um Worker vinculado ao bucket
		if (CONFIG.r2.listUrl) {
			const nuvens = [];
			let cursor = null;

			do {
				const api = new URL(CONFIG.r2.listUrl, window.location.href);
				if (cursor) api.searchParams.set("cursor", cursor);
				const resp = await fetch(api);
				if (!resp.ok) {
					const erro = resp.headers.get("content-type")?.includes("application/json")
						? await resp.json()
						: null;
					throw new Error(erro?.error || "Falha ao listar bucket Cloudflare R2 (HTTP " + resp.status + ")");
				}

				const dados = await resp.json();
				if (!Array.isArray(dados.objects)) {
					throw new Error("Resposta inválida do Worker: era esperada uma lista em 'objects'.");
				}

				for (const objeto of dados.objects) {
					if (typeof objeto.key !== "string" || !objeto.key.toLowerCase().endsWith(".copc.laz")) continue;
					const nomeArquivo = objeto.key.split("/").pop();
					const caminho = objeto.key.split("/").map(encodeURIComponent).join("/");
					nuvens.push({
						nome: nomeArquivo.replace(/\.copc\.laz$/i, ""),
						url: `${CONFIG.r2.publicBaseUrl.replace(/\/$/, "")}/${caminho}`,
						descricao: (objeto.size / 1024 / 1024).toFixed(1) + " MB — Cloudflare R2"
					});
				}

				if (dados.truncated && !dados.nextCursor) {
					throw new Error("O Worker informou mais arquivos, mas não retornou o cursor da próxima página.");
				}
				cursor = dados.truncated ? dados.nextCursor : null;
			} while (cursor);

			return nuvens.sort((a, b) => a.nome.localeCompare(b.nome));
		}

		// MODO 3 — Firebase Storage
		if (CONFIG.firebase.bucket) {
			const b = CONFIG.firebase.bucket;
			const api = `https://firebasestorage.googleapis.com/v0/b/${encodeURIComponent(b)}/o?prefix=${encodeURIComponent(CONFIG.firebase.prefix)}&maxResults=1000`;
			const resp = await fetch(api);
			if (!resp.ok) throw new Error("Falha ao listar bucket Firebase (HTTP " + resp.status + ")");
			const dados = await resp.json();
			const validos = (dados.items || []).filter(it =>
				it.name.endsWith("metadata.json") || it.name.endsWith("cloud.js") ||
				it.name.endsWith("ept.json") || it.name.endsWith(".copc.laz"));
			return validos.map(it => ({
				nome: it.name.split("/").pop().replace(/\.(json|laz)$/i, ""),
				url: `https://firebasestorage.googleapis.com/v0/b/${encodeURIComponent(b)}/o/${encodeURIComponent(it.name)}?alt=media`,
				descricao: (it.size / 1024).toFixed(0) + " KB — Firebase Storage"
			}));
		}
		// MODO 1 — manifesto nuvens.json
		const resp = await fetch(CONFIG.manifestUrl, { cache: "no-store" });
		if (!resp.ok) throw new Error("Não foi possível ler " + CONFIG.manifestUrl + " (HTTP " + resp.status + ")");
		const dados = await resp.json();
		return dados.nuvens || [];
	}

	function renderizarLista(nuvens, urlSelecionada = null) {
		elLista.innerHTML = "";
		if (!nuvens.length) {
			elLista.innerHTML = '<div id="status-lista">Nenhuma nuvem encontrada nos arquivos configurados.</div>';
			return;
		}
		for (const nuvem of nuvens) {
			const item = document.createElement("div");
			item.className = "item-nuvem";
			item.innerHTML = `<div class="nome"></div><div class="detalhe"></div>`;
			item.querySelector(".nome").textContent = nuvem.nome;
			item.querySelector(".detalhe").textContent = nuvem.descricao || nuvem.url;
			if (nuvem.url === urlSelecionada) item.classList.add("ativo");
			item.addEventListener("click", () => {
				document.querySelectorAll(".item-nuvem").forEach(e => e.classList.remove("ativo"));
				item.classList.add("ativo");
				carregarNuvem(nuvem);
			});
			elLista.appendChild(item);
		}
	}

	/* ------------------- carregamento da nuvem ------------------- */
	function carregarNuvem(nuvem) {
		elCarregando.style.display = "block";
		clearElevationSamplePreview();
		setElevationSamplingActive(false);
		elevationSampleResult.style.display = "none";

		// remove nuvens anteriores
		viewer.scene.pointclouds.forEach(pc => viewer.scene.scene.remove(pc));
		viewer.scene.pointclouds.length = 0;

		Potree.loadPointCloud(nuvem.url, nuvem.nome, e => {
			elCarregando.style.display = "none";
			const pc = e.pointcloud;
			viewer.scene.addPointCloud(pc);

			const material = pc.material;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			material.size = 1;

			// define a faixa de elevação conforme a extensão real da nuvem
			let faixa = null;
			if (pc.pcoGeometry && pc.pcoGeometry.tightBoundingBox) {
				const t = pc.pcoGeometry.tightBoundingBox;
				faixa = [t.min.z, t.max.z];
			} else if (pc.getAttribute && pc.getAttribute("position") && pc.getAttribute("position").range) {
				faixa = [pc.getAttribute("position").range[0][2], pc.getAttribute("position").range[1][2]];
			} else if (pc.boundingBox) {
				faixa = [pc.boundingBox.min.z, pc.boundingBox.max.z];
			}
			if (faixa) material.elevationRange = faixa;

			viewer.fitToScreen(0.6);
		});
	}

	/* ------------------- busca ------------------- */
	let cacheNuvens = [];
	document.getElementById("busca").addEventListener("input", ev => {
		const termo = ev.target.value.toLowerCase();
		renderizarLista(cacheNuvens.filter(n => n.nome.toLowerCase().includes(termo)));
	});

	/* ------------------- barra rápida ------------------- */
	document.getElementById("btn-enquadrar").addEventListener("click", () => viewer.fitToScreen(0.6));

	document.getElementById("btn-elevacao").addEventListener("click", () => {
		viewer.scene.pointclouds.forEach(pc => {
			pc.material.gradient = Potree.Gradients.RAINBOW;
			pc.material.activeAttributeName = "elevation";
		});
	});

	document.getElementById("btn-rgb").addEventListener("click", () => {
		viewer.scene.pointclouds.forEach(pc => {
			pc.material.activeAttributeName = "rgba";
		});
	});

	document.getElementById("btn-limpar").addEventListener("click", () => {
		viewer.scene.removeAllMeasurements();
	});

	/* ------------------- início ------------------- */
	const parametros = new URLSearchParams(window.location.search);
	const urlCopc = parametros.get("copc");
	let nuvemSelecionada = null;

	if (urlCopc) {
		let url;
		try {
			url = new URL(urlCopc, window.location.href);
		} catch (err) {
			mostrarErro("A URL informada no parâmetro 'copc' é inválida.");
			console.error(err);
		}

		if (url && (!["http:", "https:"].includes(url.protocol) || !url.pathname.toLowerCase().endsWith(".copc.laz"))) {
			mostrarErro("O parâmetro 'copc' precisa apontar para um arquivo .copc.laz via HTTP ou HTTPS.");
		} else if (url) {
			const nomeArquivo = url.pathname.split("/").pop() || "Nuvem COPC";
			nuvemSelecionada = {
				nome: nomeArquivo.replace(/\.copc\.laz$/i, ""),
				url: url.href,
				descricao: "Selecionada pela linha do tempo"
			};
			cacheNuvens = [nuvemSelecionada];
			renderizarLista(cacheNuvens, nuvemSelecionada.url);
			carregarNuvem(nuvemSelecionada);
		}
	}

	listarNuvens()
		.then(nuvens => {
			cacheNuvens = nuvemSelecionada ? [nuvemSelecionada, ...nuvens] : nuvens;
			renderizarLista(cacheNuvens, nuvemSelecionada?.url || null);
		})
		.catch(err => {
			elStatus.textContent = "Erro ao carregar a lista de nuvens.";
			mostrarErro(err.message + " — se a página e os arquivos estão em domínios diferentes, habilite CORS no servidor.");
			console.error(err);
		});

	</script>
